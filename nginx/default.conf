server {
    listen 80;
    server_name _; # Замените на ваш домен, например: medai-sber.ru

    # Максимальный размер загружаемых файлов (изображения, снимки, документы)
    client_max_body_size 50M;

    # Таймауты для длительной работы нейросети (RAG / GigaChat)
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # 1. Запросы к FastAPI бэкенду (http://домен/api/...)
    location /api/ {
        # Если Nginx в Docker-контейнере:
        proxy_pass http://api:8000/;
        # Если Nginx установлен на хост-машине VPS:
        # proxy_pass http://127.0.0.1:9090/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Отключаем буферизацию для потоковых ответов (Streaming/SSE)
        proxy_buffering off;
        proxy_cache off;
    }

    # 2. Основной веб-интерфейс PHP (http://домен/...)
    location / {
        # Если Nginx в Docker-контейнере:
        proxy_pass http://web:80/;
        # Если Nginx установлен на хост-машине VPS:
        # proxy_pass http://127.0.0.1:9080/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Логирование
    access_log /var/log/nginx/medai_access.log;
    error_log /var/log/nginx/medai_error.log;
}
